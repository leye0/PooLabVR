# Publish only the standalone WebGL2 benchmark, not the native CUDA/VR repo.
name: Deploy Snow Lab to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload standalone site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
